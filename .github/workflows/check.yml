name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests
        run: python3 -m unittest discover -s tests -v

      # Provider home overrides for the runner don't apply to the scratch home.
      - name: Rehearse provider links for Paseo and standalone tools
        run: |
          link_home="$(mktemp -d)"
          link() {
            env -u CODEX_HOME -u CLAUDE_CONFIG_DIR -u XDG_CONFIG_HOME \
              ./link.py --home "$link_home" --tools maple,codex,claude,opencode
          }
          link
          test "$link_home/.agents/AGENTS.md" -ef instructions/AGENTS.md
          test "$link_home/.codex/AGENTS.md" -ef instructions/AGENTS.md
          test "$link_home/.claude/CLAUDE.md" -ef instructions/AGENTS.md
          test "$link_home/.config/opencode/AGENTS.md" -ef instructions/AGENTS.md
          for skill in skills/*/SKILL.md; do
            name="$(basename "$(dirname "$skill")")"
            test "$link_home/.agents/skills/$name/SKILL.md" -ef "$skill"
            test "$link_home/.claude/skills/$name/SKILL.md" -ef "$skill"
            test "$link_home/.config/opencode/skills/$name/SKILL.md" -ef "$skill"
          done
          second_run="$(link)"
          if grep -v '^Already linked:' <<< "$second_run"; then
            echo 'The second run changed links.' >&2
            exit 1
          fi
